<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chunked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Nunito:wght@600;800&family=Playfair+Display:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Start navbar -->
  <header class="site-header">
    <a href="index.html" class="brand"><span class="brand__logo" aria-hidden="true">C</span><span data-i18n="brand">Chunked</span></a>
    <nav class="site-nav" aria-label="Main">
      <a href="#features" data-i18n="nav.features">Features</a>
      <a href="#themes" data-i18n="nav.themes">Themes</a>
      <a href="#pricing" data-i18n="nav.pricing">Pricing</a>
      <button id="lang-toggle" class="btn" type="button">العربية</button>
      <a href="app.html" class="btn btn--primary" data-i18n="cta.start">Get started free</a>
    </nav>
  </header>
  <!-- End navbar -->

  <main>
    <!-- Start hero -->
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <h1 id="hero-title"><span data-i18n="hero.l1">Your day.</span><br><span data-i18n="hero.l2">Your growth.</span><br><em data-i18n="hero.l3">Your focus.</em></h1>
        <p class="muted" data-i18n="hero.sub"></p>
        <a href="app.html" class="btn btn--primary" data-i18n="cta.demo">Open dashboard</a>
      </div>
      <div class="card" aria-hidden="true"><div class="chip">Dhuhr · 1:34</div><h2>Good morning, Ahmad</h2><div class="bar"><div class="bar__fill" style="width:68%"></div></div></div>
    </section>
    <!-- End hero -->

    <!-- Start modules -->
    <section id="features" class="section" aria-labelledby="mod-title">
      <h2 id="mod-title" data-i18n="mod.title"></h2><p class="muted" data-i18n="mod.sub"></p>
      <div class="grid-3">
        <article class="card"><h3 data-i18n="mod.day"></h3><p class="muted" data-i18n="mod.dayD"></p></article>
        <article class="card"><h3 data-i18n="mod.grow"></h3><p class="muted" data-i18n="mod.growD"></p></article>
        <article class="card"><h3 data-i18n="mod.focus"></h3><p class="muted" data-i18n="mod.focusD"></p></article>
      </div>
    </section>
    <!-- End modules -->

    <!-- Start themes showcase -->
    <section id="themes" class="section" aria-labelledby="themes-title">
      <h2 id="themes-title" data-i18n="themes.title"></h2><p class="muted" data-i18n="themes.sub"></p>
      <div class="grid-3">
        <button class="theme-card" data-theme-pick="light" aria-pressed="true" data-i18n="theme.light"></button>
        <button class="theme-card" data-theme-pick="dark" aria-pressed="false" data-i18n="theme.dark"></button>
        <button class="theme-card" data-theme-pick="gothic" aria-pressed="false" data-i18n="theme.gothic"></button>
        <button class="theme-card" data-theme-pick="ramadan" aria-pressed="false" data-i18n="theme.ramadan"></button>
      </div>
    </section>
    <!-- End themes showcase -->

    <!-- Start pricing -->
    <section id="pricing" class="section" aria-labelledby="price-title">
      <h2 id="price-title" data-i18n="price.title"></h2>
      <div class="grid-3">
        <article class="card"><h3 data-i18n="price.free"></h3><p class="price">$0</p><p class="muted" data-i18n="price.freeD"></p><a href="app.html" class="btn" data-i18n="price.freeCta"></a></article>
        <article class="card price-card--premium"><h3 data-i18n="price.premium"></h3><p class="price">$5</p><p data-i18n="price.premD"></p><a href="app.html" class="btn" data-i18n="price.premCta"></a></article>
      </div>
    </section>
    <!-- End pricing -->
  </main>

  <!-- Start footer -->
  <footer class="site-footer"><span class="brand" data-i18n="brand">Chunked</span><small class="muted" data-i18n="footer"></small></footer>
  <!-- End footer -->

  <script type="module" src="js/landing.js"></script>
</body>
</html>
