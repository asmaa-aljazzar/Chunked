<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-mode="light" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f3">
  <title>Chunked</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Bootstrap: js/utils/i18n.js swaps this file for the RTL build when the language is Arabic -->
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Our CSS (style.css imports tokens.css and components.css) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-layout="app">
  <a class="skip-link" href="#view" data-i18n="a11y.skip">Skip to content</a>

  <div id="app-shell" class="app-shell" data-nav="sidebar">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
    <div class="app-main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="polite"></div>

  <!-- Startup error banner: a failed ES module normally gives a silent blank page. This prints the reason on screen. -->
  <script>
    (function () {
      function show(msg) {
        var box = document.getElementById("boot-error");
        if (!box) {
          box = document.createElement("pre");
          box.id = "boot-error";
          box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;margin:0;padding:16px;background:#fff3f2;color:#8a1c12;border:2px solid #c0392b;border-radius:12px;font:13px/1.5 monospace;white-space:pre-wrap;max-height:50vh;overflow:auto";
          box.textContent = "Something failed to start. Open DevTools (F12) > Console for details.\n\n";
          document.body.appendChild(box);
        }
        box.textContent += msg + "\n\n";
      }
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && (t.src || t.href)) show("Could not load: " + (t.src || t.href));
        else show("JavaScript error: " + e.message + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        show("Error: " + ((e.reason && e.reason.message) || e.reason));
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ES modules need a server (VS Code "Live Server" works). Opening the file by double-click will not. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
