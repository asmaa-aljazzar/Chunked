<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-mode="light" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f3">
  <title>Chunked</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Bootstrap: js/utils/i18n.js swaps this file for the RTL build when the language is Arabic -->
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Our CSS (style.css imports tokens.css and components.css) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-layout="app"> <!-- data-layout is a switch for css and js-->
  <!-- app not apply to login or landing -->
  <a class="skip-link" href="#view" data-i18n="a11y.skip">Skip to content</a>

  <div id="app-shell" class="app-shell" data-nav="sidebar"> <!--navigation is vertical side panel-->
    <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
    <div class="app-main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <!-- When open a modal popup, dialog, or full-screen drawer,
  it renders inside here so it can sit securely on top of all other content. -->
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ES modules need a server (VS Code "Live Server" works). Opening the file by double-click will not. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
