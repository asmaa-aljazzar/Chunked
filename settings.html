<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f3">
    <meta name="description" content="Personalize your Chunked workspace and choose a theme.">
    <title>Settings — Chunked</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/dashboard.css">
    <link rel="stylesheet" href="css/pages/settings.css">
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/pages/settings.js"></script>
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app-shell">
      <div id="app-nav" data-active-page="settings"></div>
      <div class="app-main">
        <div id="app-topbar"></div>
        <main class="dashboard-content settings-content" id="main-content">
          <header class="settings-intro">
            <p class="eyebrow">Make it feel like yours</p>
            <h1>Choose your theme</h1>
            <p>Pick the colors that make this space feel comfortable. You can change them whenever you like.</p>
          </header>

          <section class="settings-section" aria-labelledby="theme-picker-title">
            <div class="settings-section__heading">
              <div>
                <h2 id="theme-picker-title">Available themes</h2>
                <p>Choose from everyday, seasonal, and occasion-inspired palettes.</p>
              </div>
              <p class="theme-current" id="theme-current" aria-live="polite">Current theme: Light</p>
            </div>
            <div class="theme-groups" id="theme-options" role="group" aria-label="Choose a theme"></div>
            <p class="theme-status" id="theme-status" role="status" aria-live="polite"></p>
            <noscript><p class="theme-status">Enable JavaScript to choose a theme.</p></noscript>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
